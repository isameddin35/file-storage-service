databaseChangeLog:
  - changeSet:
      id: 20260323-2-create-audit-logs-table
      author: isameddin
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: entity_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: entity_id
                  type: BIGINT

              - column:
                  name: performed_by
                  type: VARCHAR(255)

              - column:
                  name: timestamp
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

              - column:
                  name: details
                  type: TEXT
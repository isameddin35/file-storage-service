databaseChangeLog:
  - changeSet:
      id: 004-add-fk-api-keys-user
      author: isameddin
      changes:
        - addColumn:
            tableName: api_keys
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: api_keys
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_api_keys_user